device: null
model:
  fc_hidden: 128
  forecast_horizon: 3
  cnn:
    variant: standard
    dropout: 0.1
    use_batchnorm: true
    use_channel_attention: false
    layers:
    - out_channels: 32
      kernel_size: 5
      activation: relu
      pool: max
      pool_kernel_size: 2
    - out_channels: 64
      kernel_size: 3
      activation: gelu
      pool: max
      pool_kernel_size: 2
  lstm:
    rnn_type: ssm
    hidden_size: 128
    num_layers: 2
    bidirectional: true
    dropout: 0.1
  attention:
    enabled: true
    variant: standard
    num_heads: 4
    dropout: 0.1
    add_positional_encoding: false
    positional_mode: none
  normalization:
    revin:
      enabled: false
  decomposition:
    enabled: false
data:
  data_path: data/data.xlsx
  sequence_length: 64
  horizon: 3
  feature_indices:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  target_indices:
  - 10
  - 11
  train_split: 0.7
  val_split: 0.15
  normalize: minmax
  batch_size: 64
  num_workers: 0
  shuffle_train: true
  drop_last: false
  wavelet:
    enabled: false
    wavelet: db4
    level: 3
    mode: symmetric
    take: approx
    resample_method: adaptive
train:
  epochs: 1
  loss: mse
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0001
  scheduler:
    name: cosine
    T_max: 1
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.001
  checkpoints:
    dir: checkpoints_o
    save_best_only: true
    export_best_dir: results\best_models_dual
  gradient_clip: 1.0
  mixed_precision: false
  log_dir: runs
  seed: 42
  print_every: 50
experiment_metadata:
  factor: rnn_type
  value: ssm
  tier: tier1_core
  note: '核心消融: RNN类型 = ssm'
  is_multiseed: false
